name: Verify published timetable

on:
  push:
    branches: [preview/initial-source]
  pull_request:
    branches: [main]

jobs:
  adjacent-groups:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: corepack enable && corepack pnpm install --frozen-lockfile
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: node --experimental-strip-types --test tests/pdf-parsers.test.mjs
      - run: node --experimental-strip-types scripts/check-schedule-repro.mjs
