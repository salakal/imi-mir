name: Verify published timetable

on:
  pull_request:
    branches: [main]

jobs:
  adjacent-groups:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: node --experimental-strip-types --test tests/pdf-parsers.test.mjs
      - run: node --experimental-strip-types scripts/check-schedule-repro.mjs
        env:
          IMI_VERIFY_ARTIFACT: ${{ runner.temp }}/official-schedule.pdf
      - run: node scripts/check-preview.mjs
        env:
          IMI_VERIFY_ARTIFACT: ${{ runner.temp }}/official-schedule.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-timetable
          path: ${{ runner.temp }}/official-schedule.pdf
          retention-days: 2
